<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Об'ємний Конвертер</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b0b;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Центроване початкове вікно вибору */
        .welcome-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            color: #fff;
            z-index: 20;
            backdrop-filter: blur(10px);
            width: 340px;
        }
        .welcome-screen h2 {
            margin-top: 0;
            color: #4361ee;
            font-size: 20px;
        }
        .file-input-wrapper input[type="file"] {
            display: none;
        }
        .file-upload-btn {
            display: block;
            background: #222;
            border: 2px dashed #4361ee;
            padding: 16px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #fff;
            transition: background 0.2s;
            margin-top: 20px;
        }
        .file-upload-btn:hover {
            background: #2a2a2a;
        }
        /* Панель експорту (з'являється після завантаження) */
        .ui-panel {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 12px;
            background: rgba(20, 20, 20, 0.75);
            padding: 12px 24px;
            border-radius: 14px;
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        .ui-btn {
            background-color: #4361ee;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
        }
        .ui-btn:hover {
            background-color: #3a0ca3;
            transform: translateY(-2px);
        }
        .instructions {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ccc;
            background: rgba(20, 20, 20, 0.7);
            padding: 12px 18px;
            border-radius: 10px;
            pointer-events: none;
            font-size: 13px;
            line-height: 1.6;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Початкове чисте вікно вибору файлу -->
    <div class="welcome-screen" id="welcomeScreen">
        <h2>3D Об'ємний Конвертер</h2>
        <p style="color: #aaa; font-size: 13px;">Перетворіть зображення на повноцінну 3D модель</p>
        <div class="file-input-wrapper">
            <label class="file-upload-btn">
                📁 Оберіть або перетягніть файл
                <input type="file" id="imageLoader" accept="image/*">
            </label>
        </div>
    </div>

    <div class="instructions" id="instructions">
        🖱️ <b>Обертання:</b> затисніть ліву кнопку миші та тягніть<br>
        ⚙️ <b>Масштабування:</b> коліщатко миші
    </div>

    <div id="canvas-container"></div>

    <div class="ui-panel" id="uiPanel">
        <button class="ui-btn" id="export-stl">Завантажити STL</button>
        <button class="ui-btn" id="export-glb">Завантажити GLB</button>
    </div>

    <!-- Three.js та експортери -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = null; // Жодних площин чи сіток на фоні

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x8ecae6, 0.4);
        fillLight.position.set(-10, -10, -10);
        scene.add(fillLight);

        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        // Генерація повноцінної об'ємної моделі з картинки без пустот і площини
        function generate3DFromImage(img) {
            while(modelGroup.children.length > 0){ 
                modelGroup.remove(modelGroup.children[0]); 
            }

            const canvas2D = document.createElement('canvas');
            const ctx = canvas2D.getContext('2d');
            const res = 40; 
            canvas2D.width = res;
            canvas2D.height = res;
            ctx.drawImage(img, 0, 0, res, res);
            const imgData = ctx.getImageData(0, 0, res, res).data;

            const geoCache = new THREE.BoxGeometry(0.14, 0.14, 0.14);

            for (let y = 0; y < res; y++) {
                for (let x = 0; x < res; x++) {
                    const i = (y * res + x) * 4;
                    const r = imgData[i], g = imgData[i+1], b = imgData[i+2], a = imgData[i+3];

                    if (a < 50 || (r > 235 && g > 235 && b > 235)) continue;

                    const hexColor = (r << 16) | (g << 8) | b;
                    const material = new THREE.MeshStandardMaterial({ 
                        color: hexColor, 
                        roughness: 0.4 
                    });

                    // Заповнюємо об'єм у глибину
                    const depthLayers = 4;
                    for (let z = 0; z < depthLayers; z++) {
                        const mesh = new THREE.Mesh(geoCache, material);
                        
                        const posX = (x - res / 2) * 0.14;
                        const posY = (y - res / 2) * 0.14;
                        const posZ = (z - depthLayers / 2) * 0.14 + ((255 - (r+g+b)/3) / 100);

                        mesh.position.set(posX, posY, posZ);
                        modelGroup.add(mesh);
                    }
                }
            }

            // Перевертаємо догори ногами
            modelGroup.rotation.x = Math.PI;
        }

        // Обробник завантаження файлу
        document.getElementById('imageLoader').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Ховаємо початкове вікно вибору, показуємо результат і панель експорту
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('uiPanel').style.display = 'flex';
            document.getElementById('instructions').style.display = 'block';

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    generate3DFromImage(img);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // Керування камерою (миша та зум)
        let isDragging = false, prevMouse = { x: 0, y: 0 };
        let radius = 6.0, theta = Math.PI / 4, phi = Math.PI / 3;

        function updateCam() {
            phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi));
            camera.position.set(
                radius * Math.sin(phi) * Math.sin(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.cos(theta)
            );
            camera.lookAt(0, 0, 0);
        }
        updateCam();

        window.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            theta -= (e.clientX - prevMouse.x) * 0.005;
            phi -= (e.clientY - prevMouse.y) * 0.005;
            updateCam();
            prevMouse = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('wheel', e => {
            e.preventDefault();
            radius = Math.max(2.0, Math.min(15.0, radius + e.deltaY * 0.005));
            updateCam();
        }, { passive: false });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        function download(blob, name) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = name;
            link.click();
        }

        document.getElementById('export-stl').onclick = () => {
            download(new Blob([new THREE.STLExporter().parse(modelGroup, { binary: true })], { type: 'application/octet-stream' }), 'model.stl');
        };
        document.getElementById('export-glb').onclick = () => {
            new THREE.GLTFExporter().parse(modelGroup, gltf => {
                download(new Blob([gltf], { type: 'application/octet-stream' }), 'model.glb');
            }, { binary: true });
        };
    </script>
</body>
</html>
